syntax = "proto3";

package inventory;

service InventoryService {
  rpc CheckInventory(InventoryRequest) returns (InventoryResponse);
}

message InventoryRequest {
  string item_id = 1;
  int32 quantity = 2;
}

message InventoryResponse {
  string item_id = 1;
  int32 quantity_requested = 2;
  int32 quantity_remaining = 3;
  bool available = 4;
}
